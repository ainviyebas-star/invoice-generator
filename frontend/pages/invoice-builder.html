<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Invoice - InvoicePro</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📄 InvoicePro</h1>
            <div class="nav-links">
                <a href="../index.html">Dashboard</a>
                <a href="invoice-builder.html" class="active">Create Invoice</a>
                <a href="customers.html">Customers</a>
                <a href="templates.html">Templates</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="invoice-builder">
            <h2>Create New Invoice</h2>
            <form id="invoiceForm">
                <div class="form-group">
                    <label>Customer</label>
                    <select id="customerSelect" required>
                        <option value="">Select Customer</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Template</label>
                    <select id="templateSelect">
                        <option value="1">Standard Invoice</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Issue Date</label>
                    <input type="date" id="issueDate" required>
                </div>
                
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="dueDate" required>
                </div>
                
                <div class="items-section">
                    <h3>Invoice Items</h3>
                    <div id="itemsContainer"></div>
                    <button type="button" class="btn btn-secondary" onclick="addItem()">+ Add Item</button>
                </div>
                
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Terms & Conditions</label>
                    <textarea id="terms" rows="2"></textarea>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">Create Invoice</button>
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='../index.html'">Cancel</button>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script>
        let items = [];
        
        function addItem() {
            items.push({ description: '', quantity: 1, unit_price: 0, total: 0 });
            renderItems();
        }
        
        function removeItem(index) {
            items.splice(index, 1);
            renderItems();
        }
        
        function updateItem(index, field, value) {
            items[index][field] = parseFloat(value) || value;
            if (field === 'quantity' || field === 'unit_price') {
                items[index].total = (items[index].quantity || 0) * (items[index].unit_price || 0);
            }
            renderItems();
        }
        
        function renderItems() {
            const container = document.getElementById('itemsContainer');
            if (items.length === 0) {
                container.innerHTML = '<p>No items added. Click "Add Item" to start.</p>';
                return;
            }
            
            container.innerHTML = items.map((item, idx) => `
                <div class="item-row">
                    <input type="text" placeholder="Description" value="${item.description}" 
                           onchange="updateItem(${idx}, 'description', this.value)">
                    <input type="number" placeholder="Qty" value="${item.quantity}" 
                           onchange="updateItem(${idx}, 'quantity', this.value)">
                    <input type="number" placeholder="Unit Price" value="${item.unit_price}" 
                           onchange="updateItem(${idx}, 'unit_price', this.value)">
                    <input type="number" placeholder="Total" value="${item.total.toFixed(2)}" readonly>
                    <button type="button" class="btn btn-secondary" onclick="removeItem(${idx})">✕</button>
                </div>
            `).join('');
        }
        
        async function loadCustomers() {
            try {
                const customers = await CustomerAPI.getAll();
                const select = document.getElementById('customerSelect');
                select.innerHTML = '<option value="">Select Customer</option>' + 
                    customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (error) {
                console.error('Error loading customers:', error);
            }
        }
        
        document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const subtotal = items.reduce((sum, item) => sum + item.total, 0);
            const total = subtotal;
            
            const invoiceData = {
                company_id: 1,
                customer_id: parseInt(document.getElementById('customerSelect').value),
                template_id: parseInt(document.getElementById('templateSelect').value),
                issue_date: document.getElementById('issueDate').value,
                due_date: document.getElementById('dueDate').value,
                status: 'draft',
                subtotal: subtotal,
                tax_rate: 0,
                tax_amount: 0,
                total: total,
                notes: document.getElementById('notes').value,
                terms: document.getElementById('terms').value,
                items: items
            };
            
            try {
                await InvoiceAPI.create(invoiceData);
                alert('Invoice created successfully!');
                window.location.href = '../index.html';
            } catch (error) {
                alert('Error creating invoice: ' + error.message);
            }
        });
        
// Set default dates - FIXED VERSION
const today = new Date();
const todayStr = today.toISOString().split('T')[0];
document.getElementById('issueDate').value = todayStr;

const nextMonth = new Date(today);
nextMonth.setDate(today.getDate() + 30);
const nextMonthStr = nextMonth.toISOString().split('T')[0];
document.getElementById('dueDate').value = nextMonthStr;
        
        loadCustomers();
        addItem(); // Add one empty item row
    </script>
</body>
</html>
