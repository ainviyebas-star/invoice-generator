name = "invoice-backend"
main = "src/index.js"
compatibility_date = "2024-02-08"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "invoice-db"
database_id = "2d509429-92b6-40c3-a464-2ea23f2dba54"  # ← This is NOT a secret, commit it

# Environment variables (non-secret only)
[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"

# Note: Secrets (API tokens) go in Cloudflare Dashboard, not here!