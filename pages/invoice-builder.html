<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Invoice - InvoicePro</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .invoice-builder {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        
        .form-section {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .form-section:last-child {
            border-bottom: none;
        }
        
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 0;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #475569;
            font-size: 0.875rem;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        
        .items-section {
            margin: 2rem 0;
        }
        
        .items-header {
            display: grid;
            grid-template-columns: 3fr 1fr 1.5fr 1.5fr 0.5fr;
            gap: 1rem;
            padding: 0.75rem;
            background: #f8fafc;
            border-radius: 8px;
            font-weight: 600;
            color: #475569;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        
        .item-row {
            display: grid;
            grid-template-columns: 3fr 1fr 1.5fr 1.5fr 0.5fr;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
        }
        
        .item-row input {
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.875rem;
        }
        
        .item-row input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .remove-item {
            background: #fee2e2;
            border: none;
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            color: #dc2626;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .remove-item:hover {
            background: #fecaca;
            transform: scale(1.02);
        }
        
        .add-item-btn {
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            padding: 0.75rem;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            color: #475569;
            font-weight: 500;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        
        .add-item-btn:hover {
            background: #f8fafc;
            border-color: #3b82f6;
            color: #3b82f6;
        }
        
        .summary-card {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 2rem;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 1rem;
        }
        
        /* Tax Summary Row - shows the tax amount when applied */
        .tax-summary-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 1rem;
            border-top: 1px dashed #cbd5e1;
            margin-top: 0.25rem;
            color: #475569;
        }
        
        /* Tax Controls Row - contains the checkbox */
        .tax-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-top: 1px solid #e2e8f0;
            margin-top: 0.5rem;
        }
        
        .tax-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .tax-controls label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
        }
        
        .tax-controls input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }
        
        .remove-tax-btn {
            background: #fee2e2;
            border: none;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            color: #dc2626;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        
        .remove-tax-btn:hover {
            background: #fecaca;
        }
        
        .summary-row.total {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            border-top: 2px solid #e2e8f0;
            margin-top: 0.5rem;
            padding-top: 1rem;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            justify-content: flex-end;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: #475569;
        }
        
        .btn-secondary:hover {
            background: #cbd5e1;
        }
        
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }
        
        @media (max-width: 768px) {
            .items-header, .item-row {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            
            .invoice-builder {
                padding: 1rem;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .tax-controls {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📄 InvoicePro <span id="companyNameHeader" class="company-name-header"></span></h1>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="invoice-builder.html" class="active">Create Invoice</a>
                <a href="invoices.html">Invoices</a>
                <a href="customers.html">Customers</a>
                <a href="templates.html">Templates</a>
                <a href="settings.html">⚙️ Settings</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="invoice-builder">
            <h2>Create New Invoice</h2>

            <div id="alert" class="alert" style="display: none;"></div>
            
            <form id="invoiceForm">
                <!-- Customer & Template Section -->
                <div class="form-section">
                    <div class="section-title">
                        <span>📋</span>
                        <span>Invoice Information</span>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Customer *</label>
                            <select id="customerSelect" required>
                                <option value="">Loading customers...</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Template *</label>
                            <select id="templateSelect" required>
                                <option value="">Loading templates...</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Issue Date *</label>
                            <input type="date" id="issueDate" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Due Date *</label>
                            <input type="date" id="dueDate" required>
                        </div>
                        
                        <div class="form-group">
                            <label>PO Number (Optional)</label>
                            <input type="text" id="poNumber" placeholder="PO-12345">
                        </div>
                    </div>
                </div>
                
                <!-- Items Section -->
                <div class="form-section">
                    <div class="section-title">
                        <span>📦</span>
                        <span>Invoice Items</span>
                    </div>
                    
                    <div class="items-header">
                        <div>Description</div>
                        <div>Quantity</div>
                        <div>Unit Price</div>
                        <div>Total</div>
                        <div></div>
                    </div>
                    <div id="itemsContainer"></div>
                    
                    <button type="button" class="add-item-btn" onclick="addItem()">
                        + Add Item
                    </button>
                </div>
                
                <!-- Notes & Terms -->
                <div class="form-section">
                    <div class="section-title">
                        <span>📝</span>
                        <span>Additional Information</span>
                    </div>
                    
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="notes" rows="3" placeholder="Thank you for your business!"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Terms & Conditions</label>
                        <textarea id="terms" rows="2" placeholder="Payment due within 30 days"></textarea>
                    </div>
                </div>
                
                <!-- Summary with Tax Display -->
<div class="summary-card">
    <div class="summary-row">
        <span>Subtotal:</span>
        <span id="subtotalDisplay">$0.00</span>
    </div>
    
    <!-- Tax Summary Row - Shows tax amount when applied -->
    <div class="tax-summary-row" id="taxSummaryRow" style="display: none;">
        <span id="taxNameDisplay">GST</span>
        <span id="taxAmountDisplay">$0.00</span>
    </div>
    
    <div class="summary-row total">
        <span>Total:</span>
        <span id="totalDisplay">$0.00</span>
    </div>
    
    <!-- Tax Controls - This is the checkbox you need -->
    <div class="tax-controls-row" id="taxRow">
        <div class="tax-controls">
            <label>
                <input type="checkbox" id="applyTaxCheckbox" onchange="toggleTax()">
                <span id="taxLabel">Add Tax</span>
            </label>
            <button type="button" class="remove-tax-btn" id="removeTaxBtn" onclick="removeTax()" style="display: none;">Remove Tax</button>
        </div>
    </div>
</div>
                
                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='dashboard.html'">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Create Invoice
                    </button>
                </div>
            </form>
        </div>
    </main>
    
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/header.js"></script>
    <script>
        let items = [];
        
        // Tax variables
        let taxEnabled = false;
        let taxRate = 0;
        let taxName = 'GST';
        let taxAmount = 0;
        let applyTax = false;
        
        // ============================================
        // SHOW ALERT FUNCTION
        // ============================================
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            if (!alert) return;
            
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 3000);
        }
        
        // ============================================
        // TAX FUNCTIONS
        // ============================================
        async function loadTaxSettings() {
            try {
                // Try to get from API first
                if (typeof CompanyAPI !== 'undefined') {
                    const companies = await CompanyAPI.getAll();
                    if (companies && companies.length > 0) {
                        const company = companies[0];
                        taxEnabled = company.tax_enabled === 1;
                        taxRate = company.tax_rate || 0;
                        taxName = company.tax_name || 'GST';
                        
                        // Update localStorage
                        localStorage.setItem('taxSettings', JSON.stringify({
                            tax_enabled: taxEnabled ? 1 : 0,
                            tax_rate: taxRate,
                            tax_name: taxName
                        }));
                    }
                } else {
                    // Fallback to localStorage
                    const savedTax = localStorage.getItem('taxSettings');
                    if (savedTax) {
                        const tax = JSON.parse(savedTax);
                        taxEnabled = tax.tax_enabled === 1;
                        taxRate = tax.tax_rate || 0;
                        taxName = tax.tax_name || 'GST';
                    }
                }
                
                // Update the tax label
                const taxLabel = document.getElementById('taxLabel');
                if (taxLabel && taxEnabled && taxRate > 0) {
                    taxLabel.textContent = `${taxName} (${taxRate}%)`;
                } else if (taxLabel) {
                    taxLabel.textContent = 'Add Tax';
                }
                
                // Show/hide tax row based on settings
                const taxRow = document.getElementById('taxRow');
                if (taxRow) {
                    taxRow.style.display = taxEnabled && taxRate > 0 ? 'flex' : 'none';
                    console.log('Tax row displayed:', taxEnabled && taxRate > 0);
                }
                
                console.log('Tax settings loaded:', { taxEnabled, taxRate, taxName });
                
            } catch (error) {
                console.error('Error loading tax settings:', error);
            }
        }
        
        // Toggle tax on/off
        function toggleTax() {
            const applyTaxCheckbox = document.getElementById('applyTaxCheckbox');
            const removeTaxBtn = document.getElementById('removeTaxBtn');
            const taxSummaryRow = document.getElementById('taxSummaryRow');
            const taxNameDisplay = document.getElementById('taxNameDisplay');
            
            applyTax = applyTaxCheckbox.checked;
            
            if (applyTax) {
                calculateTax();
                if (removeTaxBtn) removeTaxBtn.style.display = 'inline-block';
                if (taxSummaryRow) taxSummaryRow.style.display = 'flex';
                if (taxNameDisplay) taxNameDisplay.textContent = `${taxName} (${taxRate}%)`;
                showAlert(`${taxName} (${taxRate}%) applied to invoice`, 'info');
            } else {
                taxAmount = 0;
                updateSummary();
                if (removeTaxBtn) removeTaxBtn.style.display = 'none';
                if (taxSummaryRow) taxSummaryRow.style.display = 'none';
            }
        }
        
        // Calculate tax amount
        function calculateTax() {
            const subtotal = items.reduce((sum, item) => sum + (item.total || 0), 0);
            taxAmount = (subtotal * taxRate) / 100;
            updateSummary();
        }
        
        // Remove tax completely
        function removeTax() {
            const applyTaxCheckbox = document.getElementById('applyTaxCheckbox');
            const removeTaxBtn = document.getElementById('removeTaxBtn');
            const taxSummaryRow = document.getElementById('taxSummaryRow');
            
            if (applyTaxCheckbox) applyTaxCheckbox.checked = false;
            applyTax = false;
            taxAmount = 0;
            updateSummary();
            if (removeTaxBtn) removeTaxBtn.style.display = 'none';
            if (taxSummaryRow) taxSummaryRow.style.display = 'none';
            
            showAlert(`${taxName} removed from invoice`, 'info');
        }
        
        // Update summary with tax
        function updateSummary() {
            const subtotal = items.reduce((sum, item) => sum + (item.total || 0), 0);
            const total = subtotal + taxAmount;
            
            document.getElementById('subtotalDisplay').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('taxAmountDisplay').textContent = `$${taxAmount.toFixed(2)}`;
            document.getElementById('totalDisplay').textContent = `$${total.toFixed(2)}`;
        }
        // ============================================

        // Display company name in header
        function displayCompanyName() {
            const settings = localStorage.getItem('companySettings');
            if (settings) {
                try {
                    const company = JSON.parse(settings);
                    const nameElement = document.getElementById('companyNameHeader');
                    if (nameElement && company.name) {
                        nameElement.textContent = company.name;
                    }
                } catch(e) {
                    console.error('Error parsing company settings:', e);
                }
            }
        }
        
        // Add new item
        function addItem() {
            items.push({ 
                description: '', 
                quantity: 1, 
                unit_price: 0, 
                total: 0 
            });
            renderItems();
            if (applyTax) calculateTax();
            updateSummary();
        }
        
        // Remove item
        function removeItem(index) {
            items.splice(index, 1);
            renderItems();
            if (applyTax) calculateTax();
            updateSummary();
        }
        
        // Update item field
        function updateItem(index, field, value) {
            items[index][field] = parseFloat(value) || value;
            if (field === 'quantity' || field === 'unit_price') {
                items[index].total = (items[index].quantity || 0) * (items[index].unit_price || 0);
            }
            renderItems();
            if (applyTax) calculateTax();
            updateSummary();
        }
        
        // Render items list
        function renderItems() {
            const container = document.getElementById('itemsContainer');
            if (items.length === 0) {
                container.innerHTML = '<p style="color: #64748b; text-align: center; padding: 2rem;">No items added. Click "Add Item" to start.</p>';
                return;
            }
            
            container.innerHTML = items.map((item, idx) => `
                <div class="item-row">
                    <input type="text" 
                           placeholder="Item description" 
                           value="${escapeHtml(item.description)}" 
                           onchange="updateItem(${idx}, 'description', this.value)">
                    <input type="number" 
                           placeholder="Qty" 
                           value="${item.quantity}" 
                           step="1" 
                           min="1"
                           onchange="updateItem(${idx}, 'quantity', parseFloat(this.value))">
                    <input type="number" 
                           placeholder="Price" 
                           value="${item.unit_price}" 
                           step="0.01" 
                           min="0"
                           onchange="updateItem(${idx}, 'unit_price', parseFloat(this.value))">
                    <input type="text" 
                           value="$${item.total.toFixed(2)}" 
                           readonly 
                           style="background:#f1f5f9; font-weight: 500;">
                    <button type="button" class="remove-item" onclick="removeItem(${idx})">✕</button>
                </div>
            `).join('');
        }
        
        // Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Load customers
        async function loadCustomers() {
            try {
                if (typeof CustomerAPI === 'undefined') {
                    console.error('CustomerAPI not loaded');
                    return;
                }
                
                const customers = await CustomerAPI.getAll();
                const select = document.getElementById('customerSelect');
                
                if (select && customers && customers.length > 0) {
                    select.innerHTML = '<option value="">Select Customer</option>' + 
                        customers.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
                    
                    // Check if customer ID was passed in URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const customerId = urlParams.get('customer');
                    if (customerId) {
                        select.value = customerId;
                    }
                } else {
                    select.innerHTML = '<option value="">No customers found. Please create a customer first.</option>';
                }
            } catch (error) {
                console.error('Error loading customers:', error);
                const select = document.getElementById('customerSelect');
                select.innerHTML = '<option value="">Error loading customers</option>';
            }
        }
        
        // Load templates dynamically
        async function loadTemplates() {
            try {
                if (typeof TemplateAPI === 'undefined') {
                    console.error('TemplateAPI not loaded');
                    return;
                }
                
                const templates = await TemplateAPI.getAll();
                const select = document.getElementById('templateSelect');
                
                if (select && templates && templates.length > 0) {
                    select.innerHTML = templates.map(template => `
                        <option value="${template.id}" ${template.is_default ? 'selected' : ''}>
                            ${escapeHtml(template.name)} - ${escapeHtml(template.category || 'General')}
                        </option>
                    `).join('');
                    
                    console.log(`✅ Loaded ${templates.length} templates`);
                } else {
                    select.innerHTML = '<option value="1">Standard Invoice</option>';
                }
            } catch (error) {
                console.error('Error loading templates:', error);
                const select = document.getElementById('templateSelect');
                select.innerHTML = '<option value="1">Standard Invoice</option>';
            }
        }
        
        // Handle form submission
        document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validate API
            if (typeof InvoiceAPI === 'undefined') {
                showAlert('API not loaded. Please refresh the page.', 'error');
                return;
            }
            
            // Validate customer
            const customerId = document.getElementById('customerSelect').value;
            if (!customerId) {
                showAlert('Please select a customer', 'error');
                document.getElementById('customerSelect').focus();
                return;
            }
            
            // Validate items
            const validItems = items.filter(item => 
                item.description && item.description.trim() !== '' && 
                item.quantity > 0 && 
                item.unit_price > 0
            );
            
            if (validItems.length === 0) {
                showAlert('Please add at least one valid item with description, quantity, and price', 'error');
                return;
            }
            
            // Validate dates
            const issueDate = document.getElementById('issueDate').value;
            const dueDate = document.getElementById('dueDate').value;
            
            if (!issueDate || !dueDate) {
                showAlert('Please select issue date and due date', 'error');
                return;
            }
            
            // Calculate totals with tax
            const subtotal = validItems.reduce((sum, item) => sum + (item.quantity * item.unit_price), 0);
            const applyTaxValue = document.getElementById('applyTaxCheckbox')?.checked || false;
            const taxAmountValue = applyTaxValue ? (subtotal * taxRate) / 100 : 0;
            const total = subtotal + taxAmountValue;
            
            // Prepare invoice data
            const invoiceData = {
                company_id: 1,
                customer_id: parseInt(customerId),
                template_id: parseInt(document.getElementById('templateSelect').value),
                invoice_number: `INV-${Date.now()}`,
                po_number: document.getElementById('poNumber').value || '',
                issue_date: issueDate,
                due_date: dueDate,
                status: 'draft',
                subtotal: subtotal,
                tax_enabled: applyTaxValue ? 1 : 0,
                tax_name: taxName,
                tax_rate: applyTaxValue ? taxRate : 0,
                tax_amount: taxAmountValue,
                total: total,
                notes: document.getElementById('notes').value || '',
                terms: document.getElementById('terms').value || '',
                items: validItems.map(item => ({
                    description: item.description,
                    quantity: item.quantity,
                    unit_price: item.unit_price,
                    total: item.quantity * item.unit_price
                }))
            };
            
            // Disable submit button
            const submitBtn = document.querySelector('#invoiceForm button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Creating...';
            submitBtn.disabled = true;
            
            try {
                console.log('Creating invoice:', invoiceData);
                const result = await InvoiceAPI.create(invoiceData);
                console.log('Result:', result);
                
                showAlert('✅ Invoice created successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'invoices.html';
                }, 1500);
            } catch (error) {
                console.error('Error creating invoice:', error);
                showAlert('❌ Error creating invoice: ' + error.message, 'error');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });
        
        // Set default dates
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        document.getElementById('issueDate').value = todayStr;
        
        const nextMonth = new Date(today);
        nextMonth.setDate(today.getDate() + 30);
        const nextMonthStr = nextMonth.toISOString().split('T')[0];
        document.getElementById('dueDate').value = nextMonthStr;
        
        // Initialize page
        async function init() {
            displayCompanyName();
            await loadCustomers();
            await loadTemplates();
            await loadTaxSettings();
