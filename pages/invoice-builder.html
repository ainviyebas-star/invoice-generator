<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Invoice - InvoicePro</title>
    <link rel="stylesheet" href="../css/styles.css">
    <!-- Tesseract.js for OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        .invoice-builder {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        
        .form-section {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .form-section:last-child {
            border-bottom: none;
        }
        
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 0;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #475569;
            font-size: 0.875rem;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        
        .items-section {
            margin: 2rem 0;
        }
        
        .items-header {
            display: grid;
            grid-template-columns: 3fr 1fr 1.5fr 1.5fr 0.5fr;
            gap: 1rem;
            padding: 0.75rem;
            background: #f8fafc;
            border-radius: 8px;
            font-weight: 600;
            color: #475569;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        
        .item-row {
            display: grid;
            grid-template-columns: 3fr 1fr 1.5fr 1.5fr 0.5fr;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
        }
        
        .item-row input {
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.875rem;
        }
        
        .item-row input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .remove-item {
            background: #fee2e2;
            border: none;
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            color: #dc2626;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .remove-item:hover {
            background: #fecaca;
            transform: scale(1.02);
        }
        
        .add-item-btn {
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            padding: 0.75rem;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            color: #475569;
            font-weight: 500;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        
        .add-item-btn:hover {
            background: #f8fafc;
            border-color: #3b82f6;
            color: #3b82f6;
        }
        
        .summary-card {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 2rem;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 1rem;
        }
        
        .tax-summary-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 1rem;
            border-top: 1px dashed #cbd5e1;
            margin-top: 0.25rem;
            color: #475569;
        }
        
        .tax-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-top: 1px solid #e2e8f0;
            margin-top: 0.5rem;
        }
        
        .tax-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .tax-controls label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
        }
        
        .tax-controls input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }
        
        .remove-tax-btn {
            background: #fee2e2;
            border: none;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            color: #dc2626;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        
        .remove-tax-btn:hover {
            background: #fecaca;
        }
        
        .summary-row.total {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            border-top: 2px solid #e2e8f0;
            margin-top: 0.5rem;
            padding-top: 1rem;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            justify-content: flex-end;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: #475569;
        }
        
        .btn-secondary:hover {
            background: #cbd5e1;
        }
        
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }
        
        /* OCR Styles */
        .ocr-upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            background: #f8fafc;
            transition: all 0.2s;
        }
        
        .ocr-upload-area:hover {
            border-color: #3b82f6;
            background: #f0f9ff;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }
        
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #3b82f6;
            transition: width 0.3s;
        }
        
        .ocr-result-card {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }
        
        .ocr-field {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .ocr-field:last-child {
            border-bottom: none;
        }
        
        .ocr-field-label {
            font-weight: 600;
            color: #475569;
        }
        
        .ocr-field-value {
            color: #1e293b;
        }
        
        .accept-ocr-btn {
            margin-top: 1rem;
            width: 100%;
        }
        
        @media (max-width: 768px) {
            .items-header, .item-row {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            
            .invoice-builder {
                padding: 1rem;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .tax-controls {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📄 InvoicePro <span id="companyNameHeader" class="company-name-header"></span></h1>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="invoice-builder.html" class="active">Create Invoice</a>
                <a href="invoices.html">Invoices</a>
                <a href="customers.html">Customers</a>
                <a href="templates.html">Templates</a>
                <a href="settings.html">⚙️ Settings</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="invoice-builder">
            <h2>Create New Invoice</h2>

            <div id="alert" class="alert" style="display: none;"></div>
            
            <form id="invoiceForm">
                <!-- Customer & Template Section -->
                <div class="form-section">
                    <div class="section-title">
                        <span>📋</span>
                        <span>Invoice Information</span>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Customer *</label>
                            <select id="customerSelect" required>
                                <option value="">Loading customers...</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Template *</label>
                            <select id="templateSelect" required>
                                <option value="">Loading templates...</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Issue Date *</label>
                            <input type="date" id="issueDate" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Due Date *</label>
                            <input type="date" id="dueDate" required>
                        </div>
                        
                        <div class="form-group">
                            <label>PO Number (Optional)</label>
                            <input type="text" id="poNumber" placeholder="PO-12345">
                        </div>
                    </div>
                </div>
                
                <!-- Items Section -->
                <div class="form-section">
                    <div class="section-title">
                        <span>📦</span>
                        <span>Invoice Items</span>
                    </div>
                    
                    <div class="items-header">
                        <div>Description</div>
                        <div>Quantity</div>
                        <div>Unit Price</div>
                        <div>Total</div>
                        <div></div>
                    </div>
                    <div id="itemsContainer"></div>
                    
                    <button type="button" class="add-item-btn" onclick="addItem()">
                        + Add Item
                    </button>
                </div>
                
                <!-- Notes & Terms -->
                <div class="form-section">
                    <div class="section-title">
                        <span>📝</span>
                        <span>Additional Information</span>
                    </div>
                    
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="notes" rows="3" placeholder="Thank you for your business!"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Terms & Conditions</label>
                        <textarea id="terms" rows="2" placeholder="Payment due within 30 days"></textarea>
                    </div>
                </div>

                <!-- OCR Upload Button -->
                <div class="form-section">
                    <div class="section-title">
                        <span>📸</span>
                        <span>Quick Import from Invoice</span>
                    </div>
                    <div class="form-group">
                        <label>Upload Invoice Image to auto-fill (PNG, JPG)</label>
                        <div class="ocr-upload-area" id="ocrUploadArea">
                            <input type="file" id="ocrFileInput" accept="image/*" style="display: none;">
                            <button type="button" class="btn btn-secondary" onclick="document.getElementById('ocrFileInput').click()">
                                📄 Upload Invoice Image
                            </button>
                            <div id="ocrProgress" style="display: none; margin-top: 1rem;">
                                <div class="progress-bar">
                                    <div id="ocrProgressBar" class="progress-fill"></div>
                                </div>
                                <p id="ocrStatus" style="font-size: 0.875rem; margin-top: 0.5rem;"></p>
                            </div>
                            <div id="ocrPreview" style="display: none; margin-top: 1rem;"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Summary with Tax Display -->
                <div class="summary-card">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotalDisplay">$0.00</span>
                    </div>
                    
                    <!-- Tax Summary Row - Shows the tax amount when applied -->
                    <div class="tax-summary-row" id="taxSummaryRow" style="display: none;">
                        <span id="taxNameDisplay">GST</span>
                        <span id="taxAmountDisplay">$0.00</span>
                    </div>
                    
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="totalDisplay">$0.00</span>
                    </div>
                    
                    <!-- Tax Controls Row - Contains the checkbox -->
                    <div class="tax-controls-row" id="taxRow">
                        <div class="tax-controls">
                            <label>
                                <input type="checkbox" id="applyTaxCheckbox" onchange="toggleTax()">
                                <span id="taxLabel">Add Tax</span>
                            </label>
                            <button type="button" class="remove-tax-btn" id="removeTaxBtn" onclick="removeTax()" style="display: none;">Remove Tax</button>
                        </div>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='dashboard.html'">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Create Invoice
                    </button>
                </div>
            </form>
        </div>
    </main>
    
    <script src="../js/logger.js"></script>
    <script src="../js/security.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/header.js"></script>
    <script>
        let items = [];
        
        // Tax variables
        let taxEnabled = false;
        let taxRate = 0;
        let taxName = 'GST';
        let taxAmount = 0;
        let applyTax = false;
        
        // OCR variables
        let lastOcrResult = null;
        
        // ============================================
        // SHOW ALERT FUNCTION
        // ============================================
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            if (!alert) return;
            
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 3000);
        }
        
        // ============================================
        // OCR FUNCTIONS
        // ============================================
        
        // Extract text from image using Tesseract.js
        async function extractTextFromImage(file) {
            return new Promise((resolve, reject) => {
                if (typeof Tesseract === 'undefined') {
                    reject(new Error('Tesseract.js not loaded. Please check your internet connection.'));
                    return;
                }
                
                updateOCRProgress(5, 'Loading image...');
                
                Tesseract.recognize(
                    file,
                    'eng',
                    {
                        logger: (m) => {
                            if (m.status === 'recognizing text') {
                                const progress = 10 + (m.progress * 80);
                                updateOCRProgress(progress, `Processing: ${Math.round(m.progress * 100)}%`);
                            }
                        }
                    }
                )
                .then(({ data: { text } }) => {
                    resolve(text);
                })
                .catch((err) => {
                    console.error('Tesseract error:', err);
                    reject(err);
                });
            });
        }
        
        // Update OCR progress
        function updateOCRProgress(progress, status) {
            const progressBar = document.getElementById('ocrProgressBar');
            const statusText = document.getElementById('ocrStatus');
            if (progressBar) progressBar.style.width = `${progress}%`;
            if (statusText) statusText.textContent = status;
        }
        
        // Parse extracted text
        function parseInvoiceText(text) {
            const invoice = {
                invoice_number: '',
                invoice_date: '',
                due_date: '',
                vendor_name: '',
                subtotal: 0,
                tax_rate: 0,
                tax_amount: 0,
                total: 0,
                items: []
            };
            
            // Extract Invoice Number
            const invMatch = text.match(/Invoice\s*(?:Number|No|#)?\s*[:\-]?\s*([A-Z0-9\-]{4,20})/i);
            if (invMatch) invoice.invoice_number = invMatch[1];
            
            // Extract Date
            const dateMatch = text.match(/(?:Date|Issue Date)\s*[:\-]?\s*(\d{1,2}[/\-]\d{1,2}[/\-]\d{2,4})/i);
            if (dateMatch) invoice.invoice_date = dateMatch[1];
            
            // Extract Due Date
            const dueMatch = text.match(/Due\s*Date\s*[:\-]?\s*(\d{1,2}[/\-]\d{1,2}[/\-]\d{2,4})/i);
            if (dueMatch) invoice.due_date = dueMatch[1];
            
            // Extract Total
            const totalMatch = text.match(/Total\s*(?:Amount|Due)?\s*[:\-]?\s*\$?\s*(\d+(?:\.\d{2})?)/i);
            if (totalMatch) invoice.total = parseFloat(totalMatch[1]);
            
            // Extract Subtotal
            const subtotalMatch = text.match(/Subtotal\s*[:\-]?\s*\$?\s*(\d+(?:\.\d{2})?)/i);
            if (subtotalMatch) invoice.subtotal = parseFloat(subtotalMatch[1]);
            
            // Extract Tax Rate
            const taxMatch = text.match(/(?:GST|VAT|Tax)\s*(?:\((\d+(?:\.\d+)?)%\))?/i);
            if (taxMatch && taxMatch[1]) invoice.tax_rate = parseFloat(taxMatch[1]);
            
            // Calculate tax amount if we have subtotal and rate
            if (invoice.subtotal > 0 && invoice.tax_rate > 0) {
                invoice.tax_amount = (invoice.subtotal * invoice.tax_rate) / 100;
            }
            
            // If total exists but subtotal doesn't, estimate subtotal
            if (invoice.total > 0 && invoice.subtotal === 0 && invoice.tax_rate > 0) {
                invoice.subtotal = invoice.total / (1 + invoice.tax_rate / 100);
                invoice.tax_amount = invoice.total - invoice.subtotal;
            }
            
            // Extract Vendor Name (first few lines often contain business name)
            const lines = text.split('\n');
            for (let i = 0; i < Math.min(5, lines.length); i++) {
                const line = lines[i].trim();
                if (line.length > 5 && line.length < 100 && !line.match(/invoice|date|total|subtotal/i)) {
                    invoice.vendor_name = line;
                    break;
                }
            }
            
            return invoice;
        }
        
        // Handle file upload
        async function handleOCRFileUpload(file) {
            const progressDiv = document.getElementById('ocrProgress');
            const previewDiv = document.getElementById('ocrPreview');
            
            progressDiv.style.display = 'block';
            previewDiv.style.display = 'none';
            updateOCRProgress(0, 'Starting OCR...');
            
            try {
                const extractedText = await extractTextFromImage(file);
                updateOCRProgress(95, 'Parsing invoice data...');
                
                const invoiceData = parseInvoiceText(extractedText);
                lastOcrResult = invoiceData;
                
                displayOCRPreview(invoiceData);
                previewDiv.style.display = 'block';
                showAlert('Invoice data extracted successfully! Review and accept.', 'success');
                
            } catch (error) {
                console.error('OCR Error:', error);
                showAlert('OCR failed: ' + error.message, 'error');
            } finally {
                progressDiv.style.display = 'none';
            }
        }
        
        function displayOCRPreview(data) {
            const previewDiv = document.getElementById('ocrPreview');
            
            previewDiv.innerHTML = `
                <div class="ocr-result-card">
                    <h4 style="margin-bottom: 0.75rem;">📋 Extracted Information</h4>
                    <div class="ocr-field">
                        <span class="ocr-field-label">Invoice #:</span>
                        <span class="ocr-field-value">${data.invoice_number || 'Not detected'}</span>
                    </div>
                    <div class="ocr-field">
                        <span class="ocr-field-label">Invoice Date:</span>
                        <span class="ocr-field-value">${data.invoice_date || 'Not detected'}</span>
                    </div>
                    <div class="ocr-field">
                        <span class="ocr-field-label">Due Date:</span>
                        <span class="ocr-field-value">${data.due_date || 'Not detected'}</span>
                    </div>
                    <div class="ocr-field">
                        <span class="ocr-field-label">Vendor:</span>
                        <span class="ocr-field-value">${data.vendor_name || 'Not detected'}</span>
                    </div>
                    <div class="ocr-field">
                        <span class="ocr-field-label">Subtotal:</span>
                        <span class="ocr-field-value">$${data.subtotal.toFixed(2)}</span>
                    </div>
                    <div class="ocr-field">
                        <span class="ocr-field-label">Tax Rate:</span>
                        <span class="ocr-field-value">${data.tax_rate}%</span>
                    </div>
                    <div class="ocr-field">
                        <span class="ocr-field-label">Tax Amount:</span>
                        <span class="ocr-field-value">$${data.tax_amount.toFixed(2)}</span>
                    </div>
                    <div class="ocr-field">
                        <span class="ocr-field-label">Total:</span>
                        <span class="ocr-field-value"><strong>$${data.total.toFixed(2)}</strong></span>
                    </div>
                    <button type="button" class="btn btn-primary accept-ocr-btn" onclick="acceptOCRData()">
                        ✅ Accept & Fill Invoice
                    </button>
                </div>
            `;
        }
        
        // Make acceptOCRData available globally
        window.acceptOCRData = function() {
            if (!lastOcrResult) return;
            
            // Fill invoice number if detected
            if (lastOcrResult.invoice_number) {
                // You can add an invoice number field or use it as reference
                console.log('Invoice number detected:', lastOcrResult.invoice_number);
            }
            
            // Fill dates if detected
            if (lastOcrResult.invoice_date) {
                const formattedDate = lastOcrResult.invoice_date.replace(/\//g, '-');
                const dateParts = formattedDate.split('-');
                if (dateParts.length === 3) {
                    let isoDate;
                    if (dateParts[0].length === 4) {
                        isoDate = formattedDate;
                    } else {
                        isoDate = `${dateParts[2]}-${dateParts[0].padStart(2, '0')}-${dateParts[1].padStart(2, '0')}`;
                    }
                    document.getElementById('issueDate').value = isoDate;
                }
            }
            
            if (lastOcrResult.due_date) {
                const formattedDate = lastOcrResult.due_date.replace(/\//g, '-');
                const dateParts = formattedDate.split('-');
                if (dateParts.length === 3) {
                    let isoDate;
                    if (dateParts[0].length === 4) {
                        isoDate = formattedDate;
                    } else {
                        isoDate = `${dateParts[2]}-${dateParts[0].padStart(2, '0')}-${dateParts[1].padStart(2, '0')}`;
                    }
                    document.getElementById('dueDate').value = isoDate;
                }
            }
            
            // Add item from total if no items detected and total > 0
            if (lastOcrResult.total > 0 && items.length === 0) {
                items.push({
                    description: lastOcrResult.vendor_name || 'Invoice from OCR',
                    quantity: 1,
                    unit_price: lastOcrResult.total,
                    total: lastOcrResult.total
                });
                renderItems();
            }
            
            // Apply tax if detected
            if (lastOcrResult.tax_rate > 0 && lastOcrResult.tax_rate !== taxRate) {
                const taxCheckbox = document.getElementById('applyTaxCheckbox');
                if (taxCheckbox && !taxCheckbox.checked) {
                    taxCheckbox.checked = true;
                    taxRate = lastOcrResult.tax_rate;
                    toggleTax();
                }
            }
            
            updateSummary();
            
            // Hide preview
            document.getElementById('ocrPreview').style.display = 'none';
            showAlert('Invoice data filled! Review and click Create Invoice.', 'success');
        };
        
        // File input handler
        document.getElementById('ocrFileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            if (!file.type.startsWith('image/')) {
                showAlert('Please upload an image file (PNG, JPG, etc.)', 'error');
                e.target.value = '';
                return;
            }
            
            await handleOCRFileUpload(file);
            e.target.value = '';
        });
        
        // ============================================
        // TAX STATE PERSISTENCE
        // ============================================
        function saveTaxState() {
            const applyTaxCheckbox = document.getElementById('applyTaxCheckbox');
            if (applyTaxCheckbox) {
                localStorage.setItem('invoiceTaxState', applyTaxCheckbox.checked ? 'true' : 'false');
            }
        }
        
        function restoreTaxState() {
            const savedState = localStorage.getItem('invoiceTaxState');
            if (savedState === 'true') {
                const applyTaxCheckbox = document.getElementById('applyTaxCheckbox');
                if (applyTaxCheckbox) {
                    applyTaxCheckbox.checked = true;
                    applyTax = true;
                    setTimeout(() => {
                        calculateTax();
                        updateSummary();
                        const taxSummaryRow = document.getElementById('taxSummaryRow');
                        const removeTaxBtn = document.getElementById('removeTaxBtn');
                        const taxNameDisplay = document.getElementById('taxNameDisplay');
                        if (taxSummaryRow) taxSummaryRow.style.display = 'flex';
                        if (removeTaxBtn) removeTaxBtn.style.display = 'inline-block';
                        if (taxNameDisplay) taxNameDisplay.textContent = `${taxName} (${taxRate}%)`;
                    }, 100);
                }
            }
        }
        
        // ============================================
        // TAX FUNCTIONS
        // ============================================
        async function loadTaxSettings() {
            try {
                if (typeof CompanyAPI !== 'undefined') {
                    const companies = await CompanyAPI.getAll();
                    if (companies && companies.length > 0) {
                        const company = companies[0];
                        taxEnabled = company.tax_enabled === 1;
                        taxRate = company.tax_rate || 0;
                        taxName = company.tax_name || 'GST';
                        
                        localStorage.setItem('taxSettings', JSON.stringify({
                            tax_enabled: taxEnabled ? 1 : 0,
                            tax_rate: taxRate,
                            tax_name: taxName
                        }));
                    }
                } else {
                    const savedTax = localStorage.getItem('taxSettings');
                    if (savedTax) {
                        const tax = JSON.parse(savedTax);
                        taxEnabled = tax.tax_enabled === 1;
                        taxRate = tax.tax_rate || 0;
                        taxName = tax.tax_name || 'GST';
                    }
                }
                
                const taxLabel = document.getElementById('taxLabel');
                if (taxLabel && taxEnabled && taxRate > 0) {
                    taxLabel.textContent = `${taxName} (${taxRate}%)`;
                } else if (taxLabel) {
                    taxLabel.textContent = 'Add Tax';
                }
                
                console.log('Tax settings loaded:', { taxEnabled, taxRate, taxName });
                
            } catch (error) {
                console.error('Error loading tax settings:', error);
            }
        }
        
        async function forceReloadTaxSettings() {
            try {
                console.log('Force reloading tax settings from API...');
                
                if (typeof CompanyAPI !== 'undefined') {
                    const companies = await CompanyAPI.getAll();
                    if (companies && companies.length > 0) {
                        const company = companies[0];
                        taxEnabled = company.tax_enabled === 1;
                        taxRate = company.tax_rate || 0;
                        taxName = company.tax_name || 'GST';
                        
                        const freshTaxData = {
                            tax_enabled: taxEnabled ? 1 : 0,
                            tax_rate: taxRate,
                            tax_name: taxName,
                            tax_number: company.tax_number || ''
                        };
                        localStorage.setItem('taxSettings', JSON.stringify(freshTaxData));
                        
                        console.log('Fresh tax settings loaded:', { taxEnabled, taxRate, taxName });
                    } else {
                        loadTaxSettingsFromLocal();
                    }
                } else {
                    loadTaxSettingsFromLocal();
                }
                
                const taxLabel = document.getElementById('taxLabel');
                if (taxLabel && taxEnabled && taxRate > 0) {
                    taxLabel.textContent = `${taxName} (${taxRate}%)`;
                } else if (taxLabel) {
                    taxLabel.textContent = 'Add Tax';
                }
                
            } catch (error) {
                console.error('Error force reloading tax settings:', error);
                loadTaxSettingsFromLocal();
            }
        }
        
        function loadTaxSettingsFromLocal() {
            const savedTax = localStorage.getItem('taxSettings');
            if (savedTax) {
                const tax = JSON.parse(savedTax);
                taxEnabled = tax.tax_enabled === 1;
                taxRate = tax.tax_rate || 0;
                taxName = tax.tax_name || 'GST';
                console.log('Tax settings loaded from localStorage:', { taxEnabled, taxRate, taxName });
            }
        }
        
        function toggleTax() {
            const applyTaxCheckbox = document.getElementById('applyTaxCheckbox');
            const removeTaxBtn = document.getElementById('removeTaxBtn');
            const taxSummaryRow = document.getElementById('taxSummaryRow');
            const taxNameDisplay = document.getElementById('taxNameDisplay');
            
            applyTax = applyTaxCheckbox.checked;
            
            console.log('Toggle tax called. Checked:', applyTax);
            console.log('Tax rate:', taxRate);
            console.log('Tax name:', taxName);
            
            saveTaxState();
            
            if (applyTax) {
                calculateTax();
                if (removeTaxBtn) removeTaxBtn.style.display = 'inline-block';
                if (taxSummaryRow) taxSummaryRow.style.display = 'flex';
                if (taxNameDisplay) taxNameDisplay.textContent = `${taxName} (${taxRate}%)`;
                showAlert(`${taxName} (${taxRate}%) applied to invoice`, 'info');
            } else {
                taxAmount = 0;
                updateSummary();
                if (removeTaxBtn) removeTaxBtn.style.display = 'none';
                if (taxSummaryRow) taxSummaryRow.style.display = 'none';
            }
        }
        
        function calculateTax() {
            const subtotal = items.reduce((sum, item) => sum + (item.total || 0), 0);
            taxAmount = (subtotal * taxRate) / 100;
            updateSummary();
        }
        
        function removeTax() {
            const applyTaxCheckbox = document.getElementById('applyTaxCheckbox');
            const removeTaxBtn = document.getElementById('removeTaxBtn');
            const taxSummaryRow = document.getElementById('taxSummaryRow');
            
            if (applyTaxCheckbox) applyTaxCheckbox.checked = false;
            applyTax = false;
            taxAmount = 0;
            updateSummary();
            if (removeTaxBtn) removeTaxBtn.style.display = 'none';
            if (taxSummaryRow) taxSummaryRow.style.display = 'none';
            
            saveTaxState();
            showAlert(`${taxName} removed from invoice`, 'info');
        }
        
        function updateSummary() {
            const subtotal = items.reduce((sum, item) => sum + (item.total || 0), 0);
            const total = subtotal + taxAmount;
            
            document.getElementById('subtotalDisplay').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('taxAmountDisplay').textContent = `$${taxAmount.toFixed(2)}`;
            document.getElementById('totalDisplay').textContent = `$${total.toFixed(2)}`;
        }
        // ============================================

        // Display company name in header
        function displayCompanyName() {
            const settings = localStorage.getItem('companySettings');
            if (settings) {
                try {
                    const company = JSON.parse(settings);
                    const nameElement = document.getElementById('companyNameHeader');
                    if (nameElement && company.name) {
                        nameElement.textContent = company.name;
                    }
                } catch(e) {
                    console.error('Error parsing company settings:', e);
                }
            }
        }
        
        // Add new item
        function addItem() {
            items.push({ 
                description: '', 
                quantity: 1, 
                unit_price: 0, 
                total: 0 
            });
            renderItems();
            if (applyTax) calculateTax();
            updateSummary();
        }
        
        // Remove item
        function removeItem(index) {
            items.splice(index, 1);
            renderItems();
            if (applyTax) calculateTax();
            updateSummary();
        }
        
        // Update item field
        function updateItem(index, field, value) {
            items[index][field] = parseFloat(value) || value;
            if (field === 'quantity' || field === 'unit_price') {
                items[index].total = (items[index].quantity || 0) * (items[index].unit_price || 0);
            }
            renderItems();
            if (applyTax) calculateTax();
            updateSummary();
        }
        
        // Render items list
        function renderItems() {
            const container = document.getElementById('itemsContainer');
            if (items.length === 0) {
                container.innerHTML = '<p style="color: #64748b; text-align: center; padding: 2rem;">No items added. Click "Add Item" to start.</p>';
                return;
            }
            
            container.innerHTML = items.map((item, idx) => `
                <div class="item-row">
                    <input type="text" 
                           placeholder="Item description" 
                           value="${escapeHtml(item.description)}" 
                           onchange="updateItem(${idx}, 'description', this.value)">
                    <input type="number" 
                           placeholder="Qty" 
                           value="${item.quantity}" 
                           step="1" 
                           min="1"
                           onchange="updateItem(${idx}, 'quantity', parseFloat(this.value))">
                    <input type="number" 
                           placeholder="Price" 
                           value="${item.unit_price}" 
                           step="0.01" 
                           min="0"
                           onchange="updateItem(${idx}, 'unit_price', parseFloat(this.value))">
                    <input type="text" 
                           value="$${item.total.toFixed(2)}" 
                           readonly 
                           style="background:#f1f5f9; font-weight: 500;">
                    <button type="button" class="remove-item" onclick="removeItem(${idx})">✕</button>
                </div>
            `).join('');
        }
        
        // Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Load customers
        async function loadCustomers() {
            try {
                if (typeof CustomerAPI === 'undefined') {
                    console.error('CustomerAPI not loaded');
                    return;
                }
                
                const customers = await CustomerAPI.getAll();
                const select = document.getElementById('customerSelect');
                
                if (select && customers && customers.length > 0) {
                    select.innerHTML = '<option value="">Select Customer</option>' + 
                        customers.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const customerId = urlParams.get('customer');
                    if (customerId) {
                        select.value = customerId;
                    }
                } else {
                    select.innerHTML = '<option value="">No customers found. Please create a customer first.</option>';
                }
            } catch (error) {
                console.error('Error loading customers:', error);
                const select = document.getElementById('customerSelect');
                select.innerHTML = '<option value="">Error loading customers</option>';
            }
        }
        
        // Load templates dynamically
        async function loadTemplates() {
            try {
                if (typeof TemplateAPI === 'undefined') {
                    console.error('TemplateAPI not loaded');
                    return;
                }
                
                const templates = await TemplateAPI.getAll();
                const select = document.getElementById('templateSelect');
                
                if (select && templates && templates.length > 0) {
                    select.innerHTML = templates.map(template => `
                        <option value="${template.id}" ${template.is_default ? 'selected' : ''}>
                            ${escapeHtml(template.name)} - ${escapeHtml(template.category || 'General')}
                        </option>
                    `).join('');
                    
                    console.log(`✅ Loaded ${templates.length} templates`);
                } else {
                    select.innerHTML = '<option value="1">Standard Invoice</option>';
                }
            } catch (error) {
                console.error('Error loading templates:', error);
                const select = document.getElementById('templateSelect');
                select.innerHTML = '<option value="1">Standard Invoice</option>';
            }
        }
        
        // Handle form submission
        document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (typeof InvoiceAPI === 'undefined') {
                showAlert('API not loaded. Please refresh the page.', 'error');
                return;
            }
            
            const customerId = document.getElementById('customerSelect').value;
            if (!customerId) {
                showAlert('Please select a customer', 'error');
                document.getElementById('customerSelect').focus();
                return;
            }
            
            const validItems = items.filter(item => 
                item.description && item.description.trim() !== '' && 
                item.quantity > 0 && 
                item.unit_price > 0
            );
            
            if (validItems.length === 0) {
                showAlert('Please add at least one valid item with description, quantity, and price', 'error');
                return;
            }
            
            const issueDate = document.getElementById('issueDate').value;
            const dueDate = document.getElementById('dueDate').value;
            
            if (!issueDate || !dueDate) {
                showAlert('Please select issue date and due date', 'error');
                return;
            }
            
            const subtotal = validItems.reduce((sum, item) => sum + (item.quantity * item.unit_price), 0);
            const applyTaxCheckbox = document.getElementById('applyTaxCheckbox');
            const applyTaxValue = applyTaxCheckbox ? applyTaxCheckbox.checked : false;
            const taxAmountValue = applyTaxValue ? (subtotal * taxRate) / 100 : 0;
            const total = subtotal + taxAmountValue;
            
            const invoiceData = {
                company_id: 1,
                customer_id: parseInt(customerId),
                template_id: parseInt(document.getElementById('templateSelect').value),
                invoice_number: `INV-${Date.now()}`,
                po_number: document.getElementById('poNumber').value || '',
                issue_date: issueDate,
                due_date: dueDate,
                status: 'draft',
                subtotal: subtotal,
                tax_enabled: applyTaxValue ? 1 : 0,
                tax_name: taxName,
                tax_rate: applyTaxValue ? taxRate : 0,
                tax_amount: taxAmountValue,
                total: total,
                notes: document.getElementById('notes').value || '',
                terms: document.getElementById('terms').value || '',
                items: validItems.map(item => ({
                    description: item.description,
                    quantity: item.quantity,
                    unit_price: item.unit_price,
                    total: item.quantity * item.unit_price
                }))
            };
            
            const submitBtn = document.querySelector('#invoiceForm button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Creating...';
            submitBtn.disabled = true;
            
            try {
                console.log('Creating invoice:', invoiceData);
                const result = await InvoiceAPI.create(invoiceData);
                console.log('Result:', result);
                
                localStorage.removeItem('invoiceTaxState');
                
                showAlert('✅ Invoice created successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'invoices.html';
                }, 1500);
            } catch (error) {
                console.error('Error creating invoice:', error);
                showAlert('❌ Error creating invoice: ' + error.message, 'error');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });
        
        // Set default dates
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        document.getElementById('issueDate').value = todayStr;
        
        const nextMonth = new Date(today);
        nextMonth.setDate(today.getDate() + 30);
        const nextMonthStr = nextMonth.toISOString().split('T')[0];
        document.getElementById('dueDate').value = nextMonthStr;
        
        // Initialize page
        async function init() {
            displayCompanyName();
            await loadCustomers();
            await loadTemplates();
            await forceReloadTaxSettings();
            addItem();
            restoreTaxState();
        }
        
        init();
    </script>
</body>
</html>
