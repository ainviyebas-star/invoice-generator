<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Invoice - InvoicePro</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📄 InvoicePro</h1>
            <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="invoice-builder.html">Create Invoice</a>
    <a href="invoices.html">Invoices</a>
    <a href="customers.html">Customers</a>
    <a href="templates.html">Templates</a>
    <a href="settings.html">⚙️ Settings</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="invoice-builder">
            <h2>Edit Invoice</h2>
            <form id="invoiceForm">
                <div class="form-group">
                    <label>Customer</label>
                    <select id="customerSelect" required>
                        <option value="">Select Customer</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Invoice Number</label>
                    <input type="text" id="invoiceNumber" required>
                </div>
                
                <div class="form-group">
                    <label>Issue Date</label>
                    <input type="date" id="issueDate" required>
                </div>
                
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="dueDate" required>
                </div>
                
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="draft">Draft</option>
                        <option value="sent">Sent</option>
                        <option value="paid">Paid</option>
                        <option value="overdue">Overdue</option>
                    </select>
                </div>
                
                <div class="items-section">
                    <h3>Invoice Items</h3>
                    <div id="itemsContainer"></div>
                    <button type="button" class="btn btn-secondary" onclick="addItem()">+ Add Item</button>
                </div>
                
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Terms & Conditions</label>
                    <textarea id="terms" rows="2"></textarea>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">Update Invoice</button>
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='view-invoice.html?id=' + getInvoiceId()">Cancel</button>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/header.js"></script>
    <script>
        let items = [];
        let originalInvoice = null;
        
        function getInvoiceId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }
        
        async function loadInvoice() {
            const invoiceId = getInvoiceId();
            if (!invoiceId) {
                alert('Invalid invoice ID');
                window.location.href = 'dashboard.html';
                return;
            }
            
            try {
                originalInvoice = await InvoiceAPI.get(invoiceId);
                items = originalInvoice.items || [];
                
                // Populate form fields
                document.getElementById('invoiceNumber').value = originalInvoice.invoice_number;
                document.getElementById('issueDate').value = originalInvoice.issue_date;
                document.getElementById('dueDate').value = originalInvoice.due_date;
                document.getElementById('status').value = originalInvoice.status;
                document.getElementById('notes').value = originalInvoice.notes || '';
                document.getElementById('terms').value = originalInvoice.terms || '';
                
                await loadCustomers();
                document.getElementById('customerSelect').value = originalInvoice.customer_id;
                
                renderItems();
            } catch (error) {
                console.error('Error loading invoice:', error);
                alert('Error loading invoice: ' + error.message);
            }
        }
        
        async function loadCustomers() {
            try {
                const customers = await CustomerAPI.getAll();
                const select = document.getElementById('customerSelect');
                select.innerHTML = '<option value="">Select Customer</option>' + 
                    customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (error) {
                console.error('Error loading customers:', error);
            }
        }
        
        function addItem() {
            items.push({ description: '', quantity: 1, unit_price: 0, total: 0 });
            renderItems();
        }
        
        function removeItem(index) {
            items.splice(index, 1);
            renderItems();
        }
        
        function updateItem(index, field, value) {
            items[index][field] = parseFloat(value) || value;
            if (field === 'quantity' || field === 'unit_price') {
                items[index].total = (items[index].quantity || 0) * (items[index].unit_price || 0);
            }
            renderItems();
        }
        
        function renderItems() {
            const container = document.getElementById('itemsContainer');
            if (items.length === 0) {
                container.innerHTML = '<p>No items added. Click "Add Item" to start.</p>';
                return;
            }
            
            container.innerHTML = items.map((item, idx) => `
                <div class="item-row">
                    <input type="text" placeholder="Description" value="${escapeHtml(item.description)}" 
                           onchange="updateItem(${idx}, 'description', this.value)">
                    <input type="number" placeholder="Qty" value="${item.quantity}" 
                           onchange="updateItem(${idx}, 'quantity', this.value)">
                    <input type="number" placeholder="Unit Price" value="${item.unit_price}" 
                           onchange="updateItem(${idx}, 'unit_price', this.value)">
                    <input type="number" placeholder="Total" value="${item.total.toFixed(2)}" readonly>
                    <button type="button" class="btn btn-secondary" onclick="removeItem(${idx})">✕</button>
                </div>
            `).join('');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const subtotal = items.reduce((sum, item) => sum + item.total, 0);
            const total = subtotal;
            
            const invoiceData = {
                ...originalInvoice,
                customer_id: parseInt(document.getElementById('customerSelect').value),
                invoice_number: document.getElementById('invoiceNumber').value,
                issue_date: document.getElementById('issueDate').value,
                due_date: document.getElementById('dueDate').value,
                status: document.getElementById('status').value,
                subtotal: subtotal,
                total: total,
                notes: document.getElementById('notes').value,
                terms: document.getElementById('terms').value,
                items: items
            };
            
            try {
                await InvoiceAPI.update(originalInvoice.id, invoiceData);
                alert('Invoice updated successfully!');
                window.location.href = `view-invoice.html?id=${originalInvoice.id}`;
            } catch (error) {
                alert('Error updating invoice: ' + error.message);
            }
        });
        
        loadInvoice();
    </script>
</body>
</html>
